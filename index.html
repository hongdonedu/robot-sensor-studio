<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>센서 탐험대 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="assets/mascot.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 왼쪽 고정 단계 사이드바(남색) + 가운데 활동 열(최대 900px). 태블릿 가로/세로 모두 한 손으로 조작. */
:root{
  --bg:#f2f5ff; --paper:#ffffff; --paper-2:#eef2ff; --line:#dfe5fb; --line-2:#c9d2f5;
  --ink:#141a3a; --ink-2:#4a5281; --ink-3:#8089b4;
  --side:#141a3a; --side-ink:#e9edff; --side-dim:#8e97c8; --side-hover:#1f2750; --side-active:#2a3570;
  --accent:#19c8a0; --accent-ink:#0b7f64; --accent-soft:#dcf7ef;
  --sky:#3aa7ff; --sky-soft:#e3f1ff;
  --ir:#ff5a5f; --ir-soft:#ffe4e5; --light:#ffb703; --light-soft:#fff3cf; --sound:#3a86ff; --sound-soft:#e0ecff; --touch:#2ec27e; --touch-soft:#dcf5e8;
  --star:#ffcc33; --danger:#e5484d;
  --shadow:0 10px 30px -14px rgba(20,26,58,.25);
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1230; --paper:#171c3f; --paper-2:#1f2550; --line:#2a3160; --line-2:#394380;
    --ink:#eef1ff; --ink-2:#b7bfe6; --ink-3:#8089b4;
    --side:#090c22; --side-ink:#e9edff; --side-dim:#7c86b8; --side-hover:#161b3d; --side-active:#232b5c;
    --accent:#2fe0b7; --accent-ink:#8ff0d6; --accent-soft:#14382f;
    --sky:#5cb6ff; --sky-soft:#18304d;
    --ir-soft:#4a2024; --light-soft:#463a12; --sound-soft:#1c2f5c; --touch-soft:#163b2b;
    --shadow:0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1230; --paper:#171c3f; --paper-2:#1f2550; --line:#2a3160; --line-2:#394380;
  --ink:#eef1ff; --ink-2:#b7bfe6; --ink-3:#8089b4;
  --side:#090c22; --side-ink:#e9edff; --side-dim:#7c86b8; --side-hover:#161b3d; --side-active:#232b5c;
  --accent:#2fe0b7; --accent-ink:#8ff0d6; --accent-soft:#14382f;
  --sky:#5cb6ff; --sky-soft:#18304d;
  --ir-soft:#4a2024; --light-soft:#463a12; --sound-soft:#1c2f5c; --touch-soft:#163b2b;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
img{max-width:100%}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* 셸 */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.sidebar{background:var(--side);color:var(--side-ink);padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand img{width:44px;height:44px;border-radius:12px;background:#fff}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;color:var(--side-dim);font-size:12px;margin-top:-2px}
.side-label{font-size:11px;letter-spacing:.12em;color:var(--side-dim);padding:12px 10px 4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:var(--side-ink);padding:10px 10px;border-radius:12px;font-size:15px}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active)}
.nav .num{width:26px;height:26px;border-radius:9px;background:var(--side-hover);display:grid;place-items:center;font-family:var(--display);font-size:14px;flex:none}
.nav button.done .num{background:var(--accent);color:#06281f}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.me{background:var(--side-hover);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:10px}
.me img{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}
.me b{display:block}
.me small{color:var(--side-dim)}
.progress{height:8px;background:var(--side-hover);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sky));width:0;transition:width .4s}
.teacher-btn{background:transparent;border:1px dashed var(--side-dim);color:var(--side-dim);border-radius:12px;padding:8px;font-size:13px}

.main{min-width:0;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.topbar h2{font-size:26px}
.topbar .eyebrow{font-size:13px;color:var(--ink-3);letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--paper);border:1.5px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--paper-2);color:var(--ink);border:1.5px solid var(--line-2)}
.btn.primary{background:var(--accent);color:#06281f;border-color:transparent}
.btn.sky{background:var(--sky);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font-size:18px;padding:16px 24px;border-radius:18px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:21px;margin-bottom:6px}
.muted{color:var(--ink-2)}
.tiny{font-size:13px;color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line-2);border-radius:12px;padding:11px 13px;background:var(--paper);font-size:16px}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field{min-width:0}

/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;background:#101642;min-height:260px;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .in{position:relative;width:100%;padding:24px 26px;background:linear-gradient(180deg,rgba(16,22,66,0) 0%,rgba(16,22,66,.92) 70%)}
.hero .tag{display:inline-block;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;margin-bottom:8px}
.hero h1{color:#fff;font-size:clamp(28px,5vw,42px);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hero p{color:#ffe08a;margin:4px 0 0;font-weight:700}

/* 센서 */
.sensor{--c:var(--sky);--cs:var(--sky-soft);border-top:6px solid var(--c)}
.sensor .ic{width:54px;height:54px;border-radius:16px;background:var(--cs);display:grid;place-items:center;font-size:28px;margin-bottom:8px}
.sensor dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.sensor dt{color:var(--ink-3);font-weight:700}
.sensor dd{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line-2);background:var(--paper);border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.chip[data-s=ir]{--c:var(--ir);--cs:var(--ir-soft)}
.chip[data-s=light]{--c:var(--light);--cs:var(--light-soft)}
.chip[data-s=sound]{--c:var(--sound);--cs:var(--sound-soft)}
.chip[data-s=touch]{--c:var(--touch);--cs:var(--touch-soft)}

/* 탐험 미션 */
.mission{border-left:6px solid var(--c)}
.mission .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.step{background:var(--paper-2);border-radius:14px;padding:12px}
.step b{display:block;font-family:var(--display);font-weight:400;font-size:16px;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line-2);background:var(--paper);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}
.seg button.on{border-color:var(--c);background:var(--cs)}
.gauge{display:flex;align-items:center;gap:10px}
.gauge input[type=range]{flex:1;accent-color:var(--c)}
.gauge output{font-family:var(--display);font-size:22px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.verdict{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--cs)}

/* 아이디어 */
.idea-form .big-in{font-size:18px;padding:14px 16px}
.seed{background:var(--paper-2);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seed .s{font-size:16px;font-weight:700}
.sentence{font-size:17px;line-height:2;padding:12px 16px;border-radius:14px;background:var(--sky-soft);border:1.5px dashed var(--sky)}
.sentence b{background:var(--paper);padding:2px 8px;border-radius:8px}
.idea-card{--c:var(--sky);--cs:var(--sky-soft);position:relative;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--c)}
.idea-card .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3)}
.idea-card .robot{font-family:var(--display);font-size:20px}
.idea-card .body{font-size:15px}
.idea-card .body b{color:var(--ink);background:var(--cs);padding:1px 6px;border-radius:6px}
.react{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.react button{border:1.5px solid var(--line-2);background:var(--paper);border-radius:99px;padding:6px 11px;font-size:14px;font-weight:700}
.react button.on{border-color:var(--c);background:var(--cs)}
.react button:disabled{opacity:.6;cursor:default}
.hide-btn{position:absolute;top:8px;right:8px;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;font-size:12px;padding:3px 8px}
.empty{padding:30px;text-align:center;color:var(--ink-3);border:2px dashed var(--line-2);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.55);display:grid;place-items:center;padding:16px;z-index:40}
.modal .box{background:var(--paper);border-radius:22px;padding:22px;max-width:480px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{font-size:22px;margin-bottom:8px}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat div{background:var(--paper-2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}
.menu-toggle{display:none}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:14px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-100%);transition:transform .25s;z-index:30;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .sidebar.open{transform:none}
  .menu-toggle{display:inline-flex}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="수업 순서">
    <div class="brand"><img src="assets/mascot.webp" alt=""><div><b>센서 탐험대</b><small>6학년 실과 · 로봇과 융합 기술</small></div></div>
    <div class="side-label">오늘의 순서</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me"><img src="assets/mascot.webp" alt=""><div><b id="meName">이름을 정해 주세요</b><small id="meGroup">6학년 3반</small></div></div>
      <div class="progress"><i id="prog"></i></div>
      <div class="tiny" style="color:var(--side-dim)" id="progText">0 / 5 완료</div>
      <button class="teacher-btn" id="teacherBtn">🔑 선생님 메뉴</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main"><div class="col" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="modalHost"></div>

<script src="config.js?v=2"></script>
<script>
/* ---------- 데이터 ---------- */
const SENSORS = {
  ir:    {name:'적외선 센서', icon:'🔴', sees:'물체에 반사되어 돌아오는 적외선', how:'앞에 물건이 있거나 검은 선 위에 있으면 값이 달라져요', life:'로봇 청소기(낭떠러지 감지), 자동문, 선 따라가는 로봇',
          mission:'센서 앞에 손 · 흰 종이 · 검은 종이를 가까이 대 보기', a:'아무것도 없을 때', b:'손(또는 검은 종이)을 가까이 댔을 때', ask:'손을 가까이 대면 값이 어떻게 될까?'},
  light: {name:'빛 센서', icon:'💡', sees:'주변의 밝기', how:'밝으면 값이 크고, 어두우면 값이 작아져요', life:'가로등(어두워지면 켜짐), 스마트폰 화면 밝기 조절',
          mission:'손으로 센서를 가렸을 때와 손전등을 비췄을 때 비교하기', a:'손으로 가렸을 때', b:'손전등을 비췄을 때', ask:'손으로 가리면 값이 어떻게 될까?'},
  sound: {name:'소리 센서', icon:'🔊', sees:'박수처럼 큰 소리', how:'조용하면 값이 작고, 소리가 크면 값이 커져요', life:'박수로 켜는 전등, 소리에 반응하는 장난감',
          mission:'조용히 있을 때와 박수를 쳤을 때 비교하기', a:'조용히 있을 때', b:'박수를 쳤을 때', ask:'박수를 치면 값이 어떻게 될까?'},
  touch: {name:'접촉 센서', icon:'✋', sees:'눌리거나 부딪히는 것', how:'누르면 값이 바뀌고, 떼면 다시 돌아와요', life:'엘리베이터 버튼, 범퍼에 부딪히면 방향을 바꾸는 로봇 청소기',
          mission:'눌렀다 뗐을 때 값 확인하기', a:'누르지 않았을 때', b:'눌렀을 때', ask:'누르면 값이 어떻게 될까?'}
};
const SKEY = Object.keys(SENSORS);
const STEPS = [
  {id:'meet', title:'만나기', icon:'🤖'},
  {id:'learn', title:'센서 알아보기', icon:'🔎'},
  {id:'explore', title:'센서 탐험', icon:'🧪'},
  {id:'idea', title:'아이디어 떠올리기', icon:'💡'},
  {id:'gallery', title:'아이디어 전시관', icon:'🖼️'},
  {id:'reflect', title:'돌아보기', icon:'⭐'}
];
const SEEDS = {
  where:['우리 교실에서','집 현관에서','놀이터에서','병원에서','깜깜한 밤에','동생 방에서','도서관에서','비 오는 날','급식실에서','할머니 댁에서'],
  who:['동생을 위해','반려동물을 위해','할머니를 위해','친구들을 위해','나를 위해','선생님을 위해','길 잃은 사람을 위해']
};
const CLS_DEFAULT = '6-3';
const TEACHER_KEY = (window.TEACHER_KEY||'2022');

/* ---------- 저장(기기 안) ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('rss-'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('rss-'+k, JSON.stringify(v)); }catch(e){} }
};
let me = store.get('me', {num:'', name:'', group:'', cls:CLS_DEFAULT});
const who = m => (m.num?m.num+'번 ':'')+(m.name||'');
let explore = store.get('explore', {});      // {ir:{predict, a, b, note}}
let myIdeas = store.get('myIdeas', []);
let reacted = store.get('reacted', {});     // {postId: {like:1}}
let reflect = store.get('reflect', {c1:false,c2:false,c3:false,line:''});
let teacher = store.get('teacher', false);
let posts = [];
let cur = location.hash.replace('#','') || store.get('step','meet');
if(!STEPS.some(s=>s.id===cur)) cur='meet';

/* ---------- 게시판 저장소 ---------- */
const API = String(window.BOARD_API_URL||'').trim();
const board = {
  mode: API ? 'cloud' : 'local',
  async list(){
    if(this.mode==='local'){ return store.get('localPosts', []); }
    const r = await fetch(API + (teacher?('?key='+encodeURIComponent(TEACHER_KEY)):''), {redirect:'follow'});
    const d = await r.json(); return d.posts||[];
  },
  async send(payload){
    if(this.mode==='local'){
      const all = store.get('localPosts', []);
      if(payload.action==='post'){ const p={...payload, action:payload.act, id:'p'+Date.now(), time:new Date().toISOString(), likes:0,wows:0,wants:0,hidden:false}; delete p.act; all.unshift(p); store.set('localPosts',all); return {ok:true,id:p.id}; }
      if(payload.action==='react'){ const p=all.find(x=>x.id===payload.postId); if(p){ p[payload.kind+'s']=(p[payload.kind+'s']||0)+1; store.set('localPosts',all);} return {ok:true}; }
      if(payload.action==='hide'){ const p=all.find(x=>x.id===payload.postId); if(p){ p.hidden=!!payload.hidden; store.set('localPosts',all);} return {ok:true}; }
    }
    const r = await fetch(API, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...payload, key: teacher?TEACHER_KEY:undefined})});
    return await r.json();
  }
};

/* ---------- 유틸 ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function doneSteps(){
  return {
    meet: !!me.name,
    learn: !!store.get('learnSeen',false),
    explore: SKEY.filter(k=>explore[k]&&explore[k].note).length>=2,
    idea: myIdeas.length>=1,
    gallery: Object.keys(reacted).length>=1,
    reflect: !!reflect.line
  };
}
function renderNav(){
  const d=doneSteps(); const n=$('#nav'); n.innerHTML='';
  STEPS.forEach((s,i)=>{ const b=document.createElement('button'); b.className=d[s.id]?'done':''; if(s.id===cur) b.setAttribute('aria-current','page');
    b.innerHTML=`<span class="num">${d[s.id]?'✓':i}</span><span>${s.icon} ${s.title}</span>`; b.onclick=()=>go(s.id); n.appendChild(b); });
  const c=Object.values(d).filter(Boolean).length-(d.meet?1:0); const tot=STEPS.length-1;
  $('#prog').style.width=(c/tot*100)+'%'; $('#progText').textContent=`${c} / ${tot} 완료`;
  $('#meName').textContent= me.name ? who(me) : '학번과 이름을 적어 주세요';
  $('#meGroup').textContent= `${me.cls||CLS_DEFAULT}반 ${me.group? '· '+me.group+'모둠':''}${teacher?' · 선생님':''}`;
}
function go(id){ cur=id; store.set('step',id); try{ history.replaceState(null,'','#'+id);}catch(e){} closeSide(); render(); window.scrollTo({top:0}); }
function closeSide(){ $('#sidebar').classList.remove('open'); $('#scrim').hidden=true; }
$('#scrim').onclick=closeSide;
function head(step, extra=''){
  const i=STEPS.findIndex(s=>s.id===step); const s=STEPS[i];
  return `<div class="topbar"><div><div class="eyebrow">${i===0?'시작':'활동 '+i} · 6학년 3반 실과</div><h2>${s.icon} ${s.title}</h2></div><div class="row"><button class="btn menu-toggle" id="menuBtn">☰ 순서</button>${extra}</div></div>`;
}
function bindMenu(){ const b=$('#menuBtn'); if(b) b.onclick=()=>{ $('#sidebar').classList.add('open'); $('#scrim').hidden=false; }; }
function sensorChip(k, on, attrs=''){ const s=SENSORS[k]; return `<button type="button" class="chip ${on?'on':''}" data-s="${k}" ${attrs}>${s.icon} ${s.name}</button>`; }

/* ---------- 화면 ---------- */
const views = {

    return head('meet') + `

    <div class="card"><h3>탐험대원 등록</h3><p class="muted">학번과 이름을 치고 들어와요. 기록과 아이디어에 이 이름이 붙어요.</p>
      <div class="grid3" style="margin-top:10px">
        <div class="field"><label class="f" for="inNum">학번(번호)</label><input type="number" id="inNum" inputmode="numeric" min="1" max="40" placeholder="예: 7" value="${esc(me.num)}"></div>
        <div class="field"><label class="f" for="inName">이름</label><input type="text" id="inName" maxlength="12" placeholder="예: 홍길동" value="${esc(me.name)}"></div>

      </div>
      <div class="row" style="margin-top:12px"><button class="btn primary big" id="saveMe">탐험 시작!</button><span class="tiny">저장은 이 태블릿 안에만 돼요.</span></div></div>
    <div class="card"><h3>오늘 할 일</h3>
      <div class="grid2" style="margin-top:8px">
        <div class="step"><b>🔎 1. 센서 알아보기</b>적외선 · 빛 · 소리 · 접촉 센서가 무엇을 느끼는지 알아봐요.</div>
        <div class="step"><b>🧪 2. 센서 탐험</b>스마트패드 앱의 [센서 값 확인] 화면을 보며 예측 → 관찰 → 설명!</div>
        <div class="step"><b>💡 3. 아이디어 떠올리기</b>"이 센서로 어떤 로봇을 만들까?" 많이, 다양하게, 엉뚱하게!</div>
        <div class="step"><b>🖼️ 4. 아이디어 전시관</b>친구 아이디어에 ❤️ 👍 🤖 반응을 남겨요.</div>
      </div></div>`;
  },
  learn(){
    store.set('learnSeen',true);
    return head('learn') + `
    <div class="card"><h3>사람은 감각 기관으로, 로봇은 센서로 느껴요</h3><p class="muted">눈·귀·피부가 보고 듣고 만지는 것처럼, 로봇의 센서는 주변 정보를 <b>숫자(0~100)</b>로 바꿔 로봇에게 알려 줘요. 로봇은 그 숫자를 보고 스스로 판단해서 움직여요.</p></div>
    <div class="grid2">${SKEY.map(k=>{const s=SENSORS[k];return `<div class="card sensor" style="--c:var(--${k});--cs:var(--${k}-soft)"><div class="ic">${s.icon}</div><h3>${s.name}</h3>
      <dl><dt>무엇을</dt><dd>${s.sees}</dd><dt>어떻게</dt><dd>${s.how}</dd><dt>생활 속</dt><dd>${s.life}</dd></dl></div>`}).join('')}</div>
    <div class="card"><h3>스마트패드 앱 연결하기</h3>
      <div class="grid3" style="margin-top:8px"><div class="step"><b>① 동글 꽂기</b>스마트패드에 스마트 동글을 꽂으면 앱이 자동으로 실행돼요.</div><div class="step"><b>② 로봇 켜기</b>네오봇의 전원을 켜고 앱과 연결되는지 확인해요.</div><div class="step"><b>③ [센서 값 확인]</b>화면에서 센서 4개의 값이 0~100으로 보여요.</div></div>
      <div class="row" style="margin-top:14px"><button class="btn primary big" onclick="go('explore')">준비 끝! 탐험하러 가기 →</button></div></div>`;
  },
  explore(){
    const ex = SKEY.map(k=>{const s=SENSORS[k]; const e=explore[k]||{}; const diff=(e.a!=null&&e.b!=null)?(e.b-e.a):null;
      const verdict = diff==null?'':(diff>5?`관찰: ${s.b.replace(' 때','')} 값이 <b>커졌어요</b> (+${diff})`:diff<-5?`관찰: ${s.b.replace(' 때','')} 값이 <b>작아졌어요</b> (${diff})`:'관찰: 값이 거의 안 바뀌었어요. 센서를 더 가까이/세게 해 볼까요?');
      const match = (e.predict&&diff!=null) ? ((e.predict==='up'&&diff>5)||(e.predict==='down'&&diff<-5)?' · 예측이 맞았어요! 🎯':(Math.abs(diff)<=5?'':' · 예측과 달랐네요. 왜 그럴까요? 🤔')) : '';
      return `<div class="card mission" style="--c:var(--${k});--cs:var(--${k}-soft)" data-k="${k}"><div class="row" style="justify-content:space-between"><h3>${s.icon} ${s.name} 미션</h3><span class="pill">${e.note?'✓ 기록 완료':'기록 전'}</span></div><p class="muted">${s.mission}</p>
      <div class="steps">
        <div class="step"><b>1 예측</b><div class="tiny" style="margin-bottom:6px">${s.ask}</div><div class="seg"><button data-p="up" class="${e.predict==='up'?'on':''}">커진다 ↑</button><button data-p="down" class="${e.predict==='down'?'on':''}">작아진다 ↓</button><button data-p="same" class="${e.predict==='same'?'on':''}">그대로</button></div></div>
        <div class="step"><b>2 관찰</b><div class="tiny">${s.a}</div><div class="gauge"><input type="range" min="0" max="100" value="${e.a??50}" data-r="a" id="r_${k}_a"><output>${e.a??'–'}</output></div><div class="tiny">${s.b}</div><div class="gauge"><input type="range" min="0" max="100" value="${e.b??50}" data-r="b" id="r_${k}_b"><output>${e.b??'–'}</output></div>${verdict?`<div class="verdict">${verdict}${match}</div>`:''}</div>
        <div class="step"><b>3 설명</b><div class="tiny" style="margin-bottom:6px">왜 그렇게 되었을까? 알게 된 점 한 줄</div><textarea data-note id="n_${k}" placeholder="예: 손을 대면 적외선이 반사되어 돌아와서 값이 커진다">${esc(e.note||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-save>기록 저장</button></div></div>
      </div></div>`;}).join('');
    return head('explore') + `<div class="card"><h3>예측 → 관찰 → 설명</h3><p class="muted">패드 화면의 센서값(0~100)을 보고 슬라이더를 맞춰요. 숫자가 정확하지 않아도 괜찮아요. <b>왜 바뀌는지</b> 말하는 게 진짜 미션!</p></div>${ex}
    <div class="card"><h3>센서가 느끼면 로봇은 움직여요</h3><p class="muted">선생님 시연: <b>빛 센서가 어두워지면 → LED 켜기</b>. 센서값이 바뀌면 로봇이 스스로 판단해서 동작해요. 이제 여러분 차례!</p><div class="row" style="margin-top:10px"><button class="btn primary big" onclick="go('idea')">아이디어 떠올리러 가기 →</button></div></div>`;
  },
  idea(){
    const d = ideaDraft;
    const mine = myIdeas.map(p=>ideaCard(p,true)).join('');
    return head('idea', `<span class="pill">보낸 아이디어 ${myIdeas.length}개</span>`) + `
    <div class="card"><h3>브레인스토밍 규칙</h3><div class="row"><span class="pill">🌊 많이</span><span class="pill">🌈 다양하게</span><span class="pill">🤪 엉뚱해도 좋아요</span><span class="pill">➕ 친구 아이디어에 보태기</span><span class="pill">🚫 평가는 나중에</span></div></div>
    <div class="card idea-form"><h3>센서로 만드는 로봇 아이디어</h3>
      <div class="seed"><span class="s">🎲 아이디어 씨앗:</span><span id="seedText">${esc(d.seed||'버튼을 눌러 씨앗을 뽑아 봐요')}</span><button class="btn" id="seedBtn">씨앗 뽑기</button></div>
      <label class="f" style="margin-top:14px">① 어떤 센서로?</label><div class="chips" id="ideaChips">${SKEY.map(k=>sensorChip(k,d.sensor===k)).join('')}</div>
      <div class="grid2" style="margin-top:12px">
        <div class="field"><label class="f" for="iSit">② 이런 상황에서 (센서가 느끼면)</label><input type="text" class="big-in" id="iSit" maxlength="40" placeholder="예: 박수를 치면" value="${esc(d.sit)}"></div>
        <div class="field"><label class="f" for="iAct">③ 로봇이 이렇게 움직여요</label><input type="text" class="big-in" id="iAct" maxlength="40" placeholder="예: 꼬리를 흔들며 달려와요" value="${esc(d.act)}"></div>
      </div>
      <div class="grid2" style="margin-top:12px">
        <div class="field"><label class="f" for="iRobot">④ 로봇 이름</label><input type="text" class="big-in" id="iRobot" maxlength="16" placeholder="예: 박수 강아지 로봇" value="${esc(d.robot)}"></div>
        <div class="field"><label class="f">⑤ 완성된 문장</label><div class="sentence" id="sentence"></div></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn primary big" id="sendIdea">전시관에 보내기 🚀</button><button class="btn ghost" id="clearIdea">비우기</button><span class="tiny">${board.mode==='cloud'?'우리 반 전시관에 바로 올라가요.':'미리보기 모드: 이 태블릿에만 저장돼요.'}</span></div>
    </div>
    ${mine?`<h3 style="font-size:20px">내가 보낸 아이디어</h3><div class="grid2">${mine}</div>`:''}`;
  },
  gallery(){
    return head('gallery', `<button class="btn" id="reload">🔄 새로고침</button>`) + `
    <div class="card"><div class="row" style="justify-content:space-between"><div><h3>우리 반 아이디어 전시관</h3><p class="muted">마음에 드는 아이디어에 반응을 남겨요. 센서를 잘 살린 아이디어엔 👍, 기발하면 ❤️, 만들고 싶으면 🤖!</p></div></div>
      <div class="chips" style="margin-top:10px" id="filterChips"><button type="button" class="chip ${gFilter==='all'?'on':''}" data-s="all">전체</button>${SKEY.map(k=>sensorChip(k,gFilter===k)).join('')}</div></div>
    <div class="stat" id="gStat"></div>
    <div class="grid2" id="gList"><div class="empty">불러오는 중…</div></div>`;
  },
  reflect(){
    const d=doneSteps(); const n=SKEY.filter(k=>explore[k]&&explore[k].note).length;
    return head('reflect') + `
    <div class="stat"><div><b>${n}</b><span>탐험한 센서</span></div><div><b>${myIdeas.length}</b><span>보낸 아이디어</span></div><div><b>${Object.keys(reacted).length}</b><span>남긴 반응</span></div></div>
    <div class="card"><h3>오늘의 나 돌아보기</h3><div style="display:grid;gap:8px;margin-top:8px">
      <label class="check"><input type="checkbox" id="c1" ${reflect.c1?'checked':''}><span>센서 4개가 각각 <b>무엇을</b> 느끼는지 말할 수 있어요.</span></label>
      <label class="check"><input type="checkbox" id="c2" ${reflect.c2?'checked':''}><span>센서값이 <b>왜</b> 바뀌는지 친구에게 설명할 수 있어요.</span></label>
      <label class="check"><input type="checkbox" id="c3" ${reflect.c3?'checked':''}><span>센서를 상황과 연결해 <b>로봇 아이디어</b>를 냈어요.</span></label></div>
      <label class="f" for="rLine" style="margin-top:14px">오늘 알게 된 것 한 줄 (로봇은 무엇으로 주변을 느끼나요?)</label><textarea id="rLine" placeholder="예: 센서가 빛·소리·거리·접촉을 숫자로 바꿔서 알려 주고, 로봇은 그 값으로 판단해 움직인다">${esc(reflect.line)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary big" id="saveReflect">저장</button></div></div>
    <div class="card"><h3>다음 시간 예고</h3><p class="muted">오늘 떠올린 아이디어 가운데 하나를 골라, 네오봇을 <b>코딩</b>해서 진짜로 움직여 봐요!</p></div>`;
  }
};
let ideaDraft = store.get('ideaDraft', {sensor:'', sit:'', act:'', robot:'', seed:''});
let gFilter='all';

function ideaCard(p, mine=false){
  const k = SENSORS[p.sensor]?p.sensor:'ir'; const s=SENSORS[k]; const r=reacted[p.id]||{};
  const btn=(kind,icon,label)=>`<button data-react="${kind}" data-id="${p.id}" class="${r[kind]?'on':''}" ${mine||r[kind]?'disabled':''}>${icon} ${label} ${p[kind+'s']||0}</button>`;
  return `<div class="card idea-card ${p.hidden?'is-hidden':''}" style="--c:var(--${k});--cs:var(--${k}-soft);${p.hidden?'opacity:.5':''}">
    ${teacher&&!mine?`<button class="hide-btn" data-hide="${p.id}" data-h="${p.hidden?0:1}">${p.hidden?'보이기':'숨기기'}</button>`:''}
    <div class="who"><span>${s.icon} ${s.name}</span><span>${esc(who(p))} · ${p.group?esc(p.group)+'모둠':''}</span></div>
    <div class="robot">${esc(p.robot||'이름 없는 로봇')}</div>
    <div class="body"><b>${esc(p.situation)}</b> → ${esc(p.action)}</div>
    <div class="react">${btn('like','👍','센서 활용')}${btn('wow','❤️','기발해요')}${btn('want','🤖','만들고 싶어')}</div></div>`;
}
function updateSentence(){ const d=ideaDraft; const s=SENSORS[d.sensor]; const el=$('#sentence'); if(!el) return;
  el.innerHTML = `<b>${s?s.name:'( 센서 )'}</b>가 <b>${esc(d.sit)||'( 이런 상황 )'}</b>을/를 느끼면, <b>${esc(d.robot)||'( 로봇 이름 )'}</b>이 <b>${esc(d.act)||'( 이렇게 움직여요 )'}</b>`; }

function render(){
  renderNav();
  const v=$('#view'); v.innerHTML = views[cur](); bindMenu();
  if(cur==='meet'){
    $('#saveMe').onclick=()=>{ const num=String(parseInt($('#inNum').value,10)||''); me={num, name:$('#inName').value.trim(), group:$('#inGroup').value, cls:$('#inCls').value.trim()||CLS_DEFAULT}; if(!me.num){toast('학번(번호)을 적어 주세요'); $('#inNum').focus(); return;} if(!me.name){toast('이름을 적어 주세요'); $('#inName').focus(); return;} store.set('me',me); toast(`${who(me)} 대원, 환영해요!`); go('learn'); };
  }
  if(cur==='explore'){
    v.querySelectorAll('.mission').forEach(card=>{ const k=card.dataset.k; explore[k]=explore[k]||{};
      card.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ explore[k].predict=b.dataset.p; store.set('explore',explore); render(); });
      card.querySelectorAll('input[type=range]').forEach(r=>{ r.oninput=()=>{ r.nextElementSibling.value=r.value; }; r.onchange=()=>{ explore[k][r.dataset.r]=+r.value; store.set('explore',explore); render(); }; });
      card.querySelector('[data-save]').onclick=()=>{ explore[k].note=card.querySelector('[data-note]').value.trim(); store.set('explore',explore); toast(explore[k].note?`${SENSORS[k].name} 기록 저장!`:'알게 된 점을 한 줄 적어 주세요'); render(); };
    });
  }
  if(cur==='idea'){
    const d=ideaDraft; updateSentence();
    const sync=()=>{ d.sit=$('#iSit').value; d.act=$('#iAct').value; d.robot=$('#iRobot').value; store.set('ideaDraft',d); updateSentence(); };
    ['iSit','iAct','iRobot'].forEach(id=>$('#'+id).oninput=sync);
    $('#ideaChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ d.sensor=c.dataset.s; $('#ideaChips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); store.set('ideaDraft',d); updateSentence(); });
    $('#seedBtn').onclick=()=>{ const w=SEEDS.where[Math.floor(Math.random()*SEEDS.where.length)], h=SEEDS.who[Math.floor(Math.random()*SEEDS.who.length)]; const k=SKEY[Math.floor(Math.random()*4)]; d.seed=`${w} ${h} · ${SENSORS[k].icon} ${SENSORS[k].name}로…`; $('#seedText').textContent=d.seed; store.set('ideaDraft',d); };
    $('#clearIdea').onclick=()=>{ ideaDraft={sensor:'',sit:'',act:'',robot:'',seed:''}; store.set('ideaDraft',ideaDraft); render(); };
    $('#sendIdea').onclick=async()=>{ sync(); if(!me.name){ toast('먼저 [만나기]에서 학번과 이름을 적어 주세요'); return; } if(!d.sensor){toast('센서를 하나 골라 주세요');return;} if(!d.sit.trim()||!d.act.trim()){toast('상황과 로봇의 움직임을 적어 주세요');return;}
      const btn=$('#sendIdea'); btn.disabled=true; btn.textContent='보내는 중…';
      try{ const res=await board.send({action:'post', num:me.num, name:me.name, group:me.group, cls:me.cls, sensor:d.sensor, situation:d.sit.trim(), act:d.act.trim(), robot:d.robot.trim()});
        if(!res.ok) throw new Error(res.error||'전송 실패');
        myIdeas.unshift({id:res.id, num:me.num, name:me.name, group:me.group, sensor:d.sensor, situation:d.sit.trim(), action:d.act.trim(), robot:d.robot.trim(), likes:0,wows:0,wants:0}); store.set('myIdeas',myIdeas);
        ideaDraft={sensor:d.sensor,sit:'',act:'',robot:'',seed:d.seed}; store.set('ideaDraft',ideaDraft); toast('전시관에 올렸어요! 하나 더 떠올려 볼까요? 💡'); render();
      }catch(e){ toast('보내지 못했어요: '+(e.message||'연결을 확인해 주세요')); btn.disabled=false; btn.textContent='전시관에 보내기 🚀'; }
    };
  }
  if(cur==='gallery'){ $('#reload').onclick=loadGallery; $('#filterChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ gFilter=c.dataset.s; render(); }); loadGallery(); }
  if(cur==='reflect'){
    $('#saveReflect').onclick=()=>{ reflect={c1:$('#c1').checked,c2:$('#c2').checked,c3:$('#c3').checked,line:$('#rLine').value.trim()}; store.set('reflect',reflect); toast(reflect.line?'오늘의 탐험 기록 완료! ⭐':'한 줄을 적어 주세요'); renderNav(); };
  }
}
async function loadGallery(){
  const list=$('#gList'); if(!list) return;
  try{ posts = await board.list(); }catch(e){ list.innerHTML=`<div class="empty">전시관을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`; return; }
  const shown = posts.filter(p=>gFilter==='all'||p.sensor===gFilter).filter(p=>teacher||!p.hidden);
  const stat=$('#gStat'); if(stat){ stat.innerHTML = `<div><b>${posts.filter(p=>!p.hidden).length}</b><span>아이디어</span></div>`+SKEY.map(k=>`<div><b>${posts.filter(p=>p.sensor===k&&!p.hidden).length}</b><span>${SENSORS[k].icon} ${SENSORS[k].name}</span></div>`).join(''); }
  list.innerHTML = shown.length ? shown.map(p=>ideaCard(p, myIdeas.some(m=>m.id===p.id))).join('') : `<div class="empty">아직 올라온 아이디어가 없어요. [아이디어 떠올리기]에서 첫 아이디어를 보내 볼까요?</div>`;
  list.querySelectorAll('[data-react]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.id, kind=b.dataset.react; b.disabled=true;
    try{ await board.send({action:'react', postId:id, kind}); reacted[id]=reacted[id]||{}; reacted[id][kind]=1; store.set('reacted',reacted); toast('반응을 남겼어요!'); loadGallery(); renderNav(); }catch(e){ toast('반응을 보내지 못했어요'); b.disabled=false; } });
  list.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{ try{ await board.send({action:'hide', postId:b.dataset.hide, hidden:b.dataset.h==='1'}); loadGallery(); }catch(e){ toast('실패했어요'); } });
}

/* ---------- 선생님 메뉴 ---------- */
$('#teacherBtn').onclick=()=>{
  const host=$('#modalHost');
  const url = location.href.split('#')[0];
  host.innerHTML = `<div class="modal" id="modal"><div class="box"><h3>🔑 선생님 메뉴</h3>
    ${teacher?`<p class="muted">선생님 모드가 켜져 있어요. 전시관에서 아이디어를 숨길 수 있어요.</p>
      <div class="row"><button class="btn" id="csvBtn">📋 아이디어 전체 복사(표)</button><button class="btn" id="offTeacher">선생님 모드 끄기</button></div>
      <h3 style="font-size:18px;margin-top:16px">접속 QR</h3><p class="tiny">${esc(url)}</p><div class="qr" id="qr"></div>
      <h3 style="font-size:18px;margin-top:16px">이 기기 초기화</h3><p class="tiny">다음 반이 쓰기 전에 이름·기록·아이디어를 지워요.</p><button class="btn" id="resetDev">🧹 이 태블릿 기록 지우기</button>`
    :`<p class="muted">선생님 비밀번호를 입력하세요.</p><input type="text" id="tKey" inputmode="numeric" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn primary" id="tOk">확인</button><button class="btn" id="resetDev">🧹 이 태블릿 기록 지우기</button></div>`}
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" id="mClose">닫기</button></div></div></div>`;
  $('#mClose').onclick=()=>host.innerHTML='';
  $('#modal').onclick=e=>{ if(e.target.id==='modal') host.innerHTML=''; };
  const rd=$('#resetDev'); if(rd) rd.onclick=()=>{ try{ Object.keys(localStorage).filter(k=>k.startsWith('rss-')&&k!=='rss-teacher').forEach(k=>localStorage.removeItem(k)); }catch(e){} me={name:'',group:'',cls:CLS_DEFAULT}; explore={}; myIdeas=[]; reacted={}; reflect={c1:false,c2:false,c3:false,line:''}; ideaDraft={sensor:'',sit:'',act:'',robot:'',seed:''}; host.innerHTML=''; toast('이 태블릿의 기록을 지웠어요'); go('meet'); };
  if(teacher){
    $('#offTeacher').onclick=()=>{ teacher=false; store.set('teacher',false); host.innerHTML=''; renderNav(); toast('선생님 모드를 껐어요'); };
    $('#csvBtn').onclick=async()=>{ try{ const all=await board.list(); const rows=[['시간','학번','이름','모둠','반','센서','상황','로봇 동작','로봇 이름','👍','❤️','🤖','숨김'].join('\t')].concat(all.map(p=>[p.time||'',p.num||'',p.name,p.group,p.cls||'',SENSORS[p.sensor]?SENSORS[p.sensor].name:p.sensor,p.situation,p.action,p.robot,p.likes||0,p.wows||0,p.wants||0,p.hidden?'숨김':''].map(x=>String(x??'').replace(/\t|\n/g,' ')).join('\t'))).join('\n');
      await navigator.clipboard.writeText(rows); toast(`아이디어 ${all.length}개를 복사했어요. 시트에 붙여 넣으세요.`); }catch(e){ toast('복사하지 못했어요 (브라우저 권한)'); } };
    try{ if(window.QRCode) new QRCode($('#qr'), {text:url, width:180, height:180}); else $('#qr').textContent='QR 라이브러리를 불러오지 못했어요'; }catch(e){}
  }else{
    const ok=()=>{ if($('#tKey').value.trim()===TEACHER_KEY){ teacher=true; store.set('teacher',true); host.innerHTML=''; renderNav(); toast('선생님 모드를 켰어요'); if(cur==='gallery') loadGallery(); } else toast('비밀번호가 달라요'); };
    $('#tOk').onclick=ok; $('#tKey').onkeydown=e=>{ if(e.key==='Enter') ok(); }; $('#tKey').focus();
  }
};

render();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
